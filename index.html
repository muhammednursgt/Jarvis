<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05080B;
    --panel:#0B1219;
    --panel-edge:#132230;
    --core:#0AF0FF;
    --core-dim:#0AF0FF33;
    --deep:#0E3A52;
    --text:#EAF6FF;
    --text-dim:#7FA3B5;
    --warm:#FF6A3D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    background-image:
      radial-gradient(ellipse at 50% -10%, #0E3A5233 0%, transparent 55%),
      repeating-linear-gradient(180deg, transparent 0 2px, #ffffff03 2px 4px);
    color:var(--text);
    font-family:'Inter', sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---- Boot overlay ---- */
  #boot{
    position:fixed; inset:0; background:var(--void); z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; transition:opacity .6s ease;
  }
  #boot .mark{
    font-family:'Orbitron'; font-weight:700; font-size:22px; letter-spacing:.14em;
    color:var(--core); text-shadow:0 0 18px var(--core-dim);
  }
  #boot .line{
    font-family:'JetBrains Mono'; font-size:11px; color:var(--text-dim);
    min-height:14px;
  }
  #boot .bar{width:180px; height:2px; background:#0E3A52; overflow:hidden; border-radius:2px;}
  #boot .bar::after{
    content:''; display:block; height:100%; width:40%; background:var(--core);
    animation:sweep 1.4s ease-in-out infinite;
  }
  @keyframes sweep{ 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }

  /* ---- Header / status ---- */
  header{
    flex:0 0 auto; padding:16px 18px 10px; display:flex; align-items:baseline;
    justify-content:space-between; border-bottom:1px solid var(--panel-edge);
  }
  header .name{font-family:'Orbitron'; font-weight:700; font-size:15px; letter-spacing:.1em; color:var(--text);}
  header .status{font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:.05em; color:var(--core); transition:color .3s;}
  header .status.warm{color:var(--warm);}

  /* ---- Core visual ---- */
  #core-wrap{flex:0 0 auto; display:flex; justify-content:center; padding:22px 0 10px;}
  #core{width:118px; height:118px; position:relative;}
  #core svg{width:100%; height:100%; overflow:visible;}
  .ring{fill:none; stroke:var(--core); opacity:.55; transform-origin:60px 60px;}
  .ring1{stroke-width:1.2;}
  .ring2{stroke-width:.8; opacity:.3;}
  .core-dot{fill:var(--core); filter:drop-shadow(0 0 8px var(--core));}
  #core.listening .ring1{animation:pulseFast 1s ease-in-out infinite;}
  #core.listening{--c:var(--warm);}
  #core.listening .ring1,#core.listening .ring2,#core.listening .core-dot{stroke:var(--warm); fill:var(--warm); filter:drop-shadow(0 0 10px var(--warm));}
  #core.thinking .ring1{animation:spin 1.6s linear infinite;}
  #core.thinking .ring2{animation:spin 2.4s linear infinite reverse;}
  #core.speaking .core-dot{animation:pulseFast .5s ease-in-out infinite;}
  #core.idle .ring1{animation:breathe 3.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1); opacity:.5} 50%{transform:scale(1.08); opacity:.85}}
  @keyframes pulseFast{0%,100%{transform:scale(1)} 50%{transform:scale(1.15)}}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- Transcript ---- */
  #log{
    flex:1 1 auto; overflow-y:auto; padding:6px 16px 12px;
    display:flex; flex-direction:column; gap:12px;
  }
  .msg{max-width:86%; font-size:14.5px; line-height:1.5;}
  .msg.user{align-self:flex-end; text-align:right; color:var(--text);}
  .msg.user .tag{color:var(--text-dim);}
  .msg.ai{align-self:flex-start; color:var(--text);}
  .msg.ai .tag{color:var(--core);}
  .tag{display:block; font-family:'JetBrains Mono'; font-size:9.5px; letter-spacing:.08em; margin-bottom:3px;}
  .msg .body{white-space:pre-wrap;}
  .hint{
    align-self:center; color:var(--text-dim); font-size:12.5px; text-align:center;
    padding:0 30px; margin-top:8px; line-height:1.6;
  }

  /* ---- Input bar ---- */
  #inputbar{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:10px 12px calc(12px + env(safe-area-inset-bottom));
    background:var(--panel); border-top:1px solid var(--panel-edge);
  }
  #mic{
    flex:0 0 auto; width:42px; height:42px; border-radius:50%;
    border:1px solid var(--panel-edge); background:var(--void);
    color:var(--core); display:flex; align-items:center; justify-content:center;
    font-size:17px; cursor:pointer; transition:all .2s;
  }
  #mic.active{background:var(--warm); border-color:var(--warm); color:var(--void);}
  #textin{
    flex:1 1 auto; background:var(--void); border:1px solid var(--panel-edge);
    border-radius:20px; padding:10px 16px; color:var(--text); font-size:14.5px;
    font-family:'Inter'; outline:none;
  }
  #textin:focus{border-color:var(--core);}
  #send{
    flex:0 0 auto; width:42px; height:42px; border-radius:50%; border:none;
    background:var(--core); color:var(--void); font-size:16px; cursor:pointer;
  }
  #send:disabled{opacity:.35;}
  #speaker-toggle{
    position:absolute; top:16px; right:18px; font-family:'JetBrains Mono';
    font-size:9.5px; color:var(--text-dim); background:none; border:1px solid var(--panel-edge);
    border-radius:12px; padding:4px 9px; cursor:pointer;
  }
  #speaker-toggle.on{color:var(--core); border-color:var(--core);}

  #log::-webkit-scrollbar{width:3px;}
  #log::-webkit-scrollbar-thumb{background:var(--panel-edge);}
</style>

<div id="boot">
  <div class="mark">OMNI&#8209;X&nbsp;AI</div>
  <div class="bar"></div>
  <div class="line" id="bootline">initializing core systems</div>
</div>

<header>
  <div class="name">OMNI&#8209;X</div>
  <div class="status" id="status">IDLE</div>
</header>

<div id="core-wrap" style="position:relative;">
  <button id="speaker-toggle" class="on" title="Toggle voice reply">VOICE: ON</button>
  <div id="core" class="idle">
    <svg viewBox="0 0 120 120">
      <circle class="ring ring2" cx="60" cy="60" r="52"></circle>
      <circle class="ring ring1" cx="60" cy="60" r="38"></circle>
      <circle class="core-dot" cx="60" cy="60" r="6"></circle>
    </svg>
  </div>
</div>

<div id="log">
  <div class="hint">Speak or type below. Omni&#8209;X keeps context of this session.</div>
</div>

<div id="inputbar">
  <button id="mic" title="Hold to talk">&#127908;</button>
