
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S Mobile HUD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #020b14;
            color: #00f0ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            overflow: hidden;
        }

        /* Ambient Glow & Grid Background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 50% 45%, rgba(0, 240, 255, 0.08) 0%, transparent 70%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            pointer-events: none;
        }

        /* Top Header */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            background: rgba(2, 15, 28, 0.6);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .sys-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00f0ff;
        }

        .status-badge {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }

        /* Core Reactor Arc Ring */
        .core-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto 0;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .ring-1 {
            width: 100%;
            height: 100%;
            border-top-color: #00f0ff;
            border-bottom-color: #00f0ff;
            animation: rotateClockwise 8s linear infinite;
            filter: drop-shadow(0 0 8px #00f0ff);
        }

        .ring-2 {
            width: 80%;
            height: 80%;
            border-left-color: #ff0055;
            border-right-color: #00f0ff;
            animation: rotateCounterClockwise 5s linear infinite;
            filter: drop-shadow(0 0 6px #ff0055);
        }

        .ring-3 {
            width: 60%;
            height: 60%;
            border: 1px dashed rgba(0, 240, 255, 0.5);
            animation: rotateClockwise 12s linear infinite;
        }

        .core-center {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f0ff 0%, rgba(0, 240, 255, 0.2) 60%, transparent 100%);
            box-shadow: 0 0 35px #00f0ff, inset 0 0 15px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .core-center:active {
            transform: scale(0.92);
        }

        .speaking .core-center {
            animation: pulseGlow 1s infinite alternate;
            background: radial-gradient(circle, #00ff88 0%, rgba(0, 255, 136, 0.2) 60%, transparent 100%);
            box-shadow: 0 0 45px #00ff88;
        }

        /* Console Output Box */
        .console-box {
            width: 100%;
            height: 110px;
            background: rgba(2, 15, 28, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            padding: 12px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            margin-bottom: 15px;
        }

        .log-msg {
            font-size: 12px;
            margin-bottom: 6px;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .log-user { color: #ffffff; text-shadow: 0 0 4px rgba(255,255,255,0.5); }
        .log-jarvis { color: #00f0ff; text-shadow: 0 0 5px #00f0ff; }

        /* Controls Section */
        .controls {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .mic-btn {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 100, 255, 0.1));
            border: 1px solid #00f0ff;
            border-radius: 10px;
            color: #00f0ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
            transition: all 0.2s;
        }

        .mic-btn:active {
            background: rgba(0, 240, 255, 0.4);
            transform: scale(0.98);
        }

        /* Animations */
        @keyframes rotateClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes pulseGlow {
            from { transform: scale(0.95); filter: brightness(1); }
            to { transform: scale(1.08); filter: brightness(1.4); }
        }
    </style>
</head>
<body>

    <!-- Upper Telemetry -->
    <div class="header">
        <div class="sys-title">J.A.R.V.I.S V3</div>
        <div class="status-badge" id="statusBadge">ONLINE</div>
    </div>

    <!-- Neon Arc Reactor Core -->
    <div class="core-container" id="coreContainer">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="core-center" onclick="startListening()"></div>
    </div>

    <!-- Hologram Console -->
    <div class="console-box" id="consoleBox">
        <div class="log-msg log-jarvis">J.A.R.V.I.S: Sistem aktif. Komut bekleniyor...</div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <button class="mic-btn" onclick="startListening()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
            </svg>
            KONUŞMAK İÇİN BAS
        </button>
    </div>

    <script>
        const consoleBox = document.getElementById('consoleBox');
        const statusBadge = document.getElementById('statusBadge');
        const coreContainer = document.getElementById('coreContainer');

        // Tarayıcı Ses Tanıma ve Konuşma Motoru
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;

        if (!SpeechRecognition) {
            addLog("J.A.R.V.I.S", "HATA: Tarayıcınız ses tanımayı desteklemiyor. Chrome veya Safari kullanın.");
        }

        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if (recognition) {
            recognition.lang = 'tr-TR';
            recognition.interimResults = false;

            recognition.onstart = () => {
                statusBadge.innerText = "DİNLİYOR...";
                statusBadge.style.borderColor = "#00f0ff";
                statusBadge.style.color = "#00f0ff";
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                addLog("Siz", text);
                processCommand(text.toLowerCase());
            };

            recognition.onerror = () => {
                resetStatus();
            };

            recognition.onend = () => {
                resetStatus();
            };
        }

        function startListening() {
            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        }

        function addLog(sender, message) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `log-msg ${sender === 'Siz' ? 'log-user' : 'log-jarvis'}`;
            msgDiv.innerText = `${sender}: ${message}`;
            consoleBox.appendChild(msgDiv);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function speak(text) {
            if (synth.speaking) synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.pitch = 0.9;
            utterance.rate = 1.0;

            utterance.onstart = () => {
                coreContainer.classList.add('speaking');
                statusBadge.innerText = "KONUŞUYOR";
                statusBadge.style.borderColor = "#00ff88";
                statusBadge.style.color = "#00ff88";
            };

            utterance.onend = () => {
                coreContainer.classList.remove('speaking');
                resetStatus();
            };

            synth.speak(utterance);
        }

        function resetStatus() {
            statusBadge.innerText = "ONLINE";
            statusBadge.style.borderColor = "#00ff88";
            statusBadge.style.color = "#00ff88";
        }

        // Basit Hazır Yanıt Mantığı (API KEY GEREKTİRMEZ)
        function processCommand(cmd) {
            let reply = "Anlamadım efendim, tekrar eder misiniz?";

            if (cmd.includes("merhaba") || cmd.includes("selam")) {
                reply = "Merhaba efendim. Sistemler tamamen aktif ve emrinizde.";
            } else if (cmd.includes("saat kaç") || cmd.includes("zaman")) {
                const now = new Date();
                reply = `Saat şu an ${now.getHours()} ${now.getMinutes()}.`;
            } else if (cmd.includes("kimsin") || cmd.includes("adın ne")) {
                reply = "Ben J.A.R.V.I.S. Sizin kişisel yapay zeka asistanınızım.";
            } else if (cmd.includes("youtube aç")) {
                reply = "YouTube açılıyor efendim.";
                window.open("https://youtube.com", "_blank");
            } else if (cmd.includes("google aç")) {
                reply = "Google açılıyor efendim.";
                window.open("https://google.com", "_blank");
            }

            addLog("J.A.R.V.I.S", reply);
            speak(reply);
        }
    </script>
</body>
</html>
